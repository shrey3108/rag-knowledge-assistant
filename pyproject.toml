[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "Production-ready AI Knowledge Assistant with strict grounding, citations, and Ollama Cloud integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "chromadb>=0.4.24",
    "sentence-transformers>=2.5.1",
    "pypdf>=4.1.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]

asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
